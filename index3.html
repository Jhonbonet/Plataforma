<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesorías del Norte - Mi QR de Asistencia</title>
    <!-- NUEVA LIBRERÍA ULTRA ESTABLE PARA GITHUB PAGES -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        #qrcode { display: inline-block; margin-top: 20px; padding: 15px; background: white; border-radius: 10px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; }
    </style>
</head>
<body>

    <h2>Asesorías del Norte</h2>
    <p>Presenta este código dinámico en la entrada</p>
    
    <div id="qrcode"></div>
    <p id="timer" style="color: gray; font-size: 14px; margin-top: 15px;"></p>

    <script>
        // Capturar ID desde la URL. Si no hay, asigna uno de prueba por defecto
        const urlParams = new URLSearchParams(window.location.search);
        const studentID = urlParams.get('id') || "EST-PRUEBA"; 

        // Inicializar el contenedor del QR vacío
        const qrContainer = document.getElementById("qrcode");
        const qrcode = new QRCode(qrContainer, {
            width: 250,
            height: 250,
            correctLevel: QRCode.CorrectLevel.H // Máxima tolerancia a errores de escaneo
        });

        function generarQRDinamico() {
            const ahora = new Date();
            
            const anio = ahora.getFullYear();
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            const hora = String(ahora.getHours()).padStart(2, '0');
            const minuto = String(ahora.getMinutes()).padStart(2, '0');
            
            // Estructura limpia para AppSheet: "ID|AÑO-MES-DIA HORA:MINUTO"
            const marcaTiempo = `${anio}-${mes}-${dia} ${hora}:${minuto}`;
            const dataParaQR = `${studentID}|${marcaTiempo}`;
            
            // Generar o actualizar el contenido del código QR
            qrcode.makeCode(dataParaQR);
            
            document.getElementById("timer").innerText = "El código se actualiza automáticamente cada 30 segundos.";
        }

        // Ejecutar la primera vez al cargar la página
        window.onload = function() {
            generarQRDinamico();
            // Refrescar cada 30 segundos
            setInterval(generarQRDinamico, 30000);
        };
    </script>
</body>
</html>
